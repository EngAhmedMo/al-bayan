<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>البيان - القرآن والسنة</title>
  <script>
    /**
     * GitHub Pages SPA Fix
     * ---
     * When a user directly visits a URL like /al-bayan/quran/1,
     * GitHub Pages returns a 404 because the file doesn't exist.
     * This page catches that 404 and redirects to index.html,
     * encoding the original path so React Router can restore it.
     *
     * pathSegmentsToKeep = 1 → keeps the /al-bayan/ segment (the repo name)
     */
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
