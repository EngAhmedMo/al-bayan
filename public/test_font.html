<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test QCF Font</title>
<style>
  @font-face {
    font-family: 'TestQCF';
    src: url('/fonts/test_qcf.ttf') format('truetype');
  }
  body {
    font-size: 50px;
  }
  .test {
    font-family: 'TestQCF';
    color: black;
  }
</style>
</head>
<body>
  <div class="test">ﱁﱂﱃﱄﱅﱆ</div>
  <script>
    document.fonts.ready.then(() => {
      document.body.innerHTML += "<p>Fonts loaded.</p>";
      document.fonts.forEach(f => {
        document.body.innerHTML += `<p>Font: ${f.family}, Status: ${f.status}</p>`;
      });
    });
  </script>
</body>
</html>
